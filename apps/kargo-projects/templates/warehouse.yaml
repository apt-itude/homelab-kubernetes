{{- range $projectName, $project := .Values.projects }}
  {{- range $warehouseName, $warehouse := $project.warehouses }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: {{ $warehouseName }}
  namespace: {{ include "kargo.projectName" $projectName }}
spec:
    {{- with $warehouse.interval }}
  interval: {{ . }}
    {{- end }}
  subscriptions:
    {{- range $repoURL, $imageConfig := ($warehouse.subscriptions.image | default dict) }}
  - image:
      repoURL: {{ $repoURL }}
      {{- with $imageConfig }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- range $chartName, $chartConfig := ($warehouse.subscriptions.chart | default dict) }}
      {{- $repoURL := $chartConfig.repoURL | required "repoURL is required for chart subscription" }}
  - chart:
      {{- /*
      repoURL in values is the dependency's Chart.yaml `repository`. Kargo expects an OCI
      subscription's repoURL to point at the chart itself and forbids `name`, whereas HTTP(S)
      subscriptions take the repo URL plus `name`.
      */}}
      {{- if hasPrefix "oci://" $repoURL }}
      repoURL: {{ trimSuffix "/" $repoURL }}/{{ $chartName }}
      {{- else }}
      repoURL: {{ $repoURL }}
      name: {{ $chartName }}
      {{- end }}
      {{- with (omit $chartConfig "repoURL") }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
