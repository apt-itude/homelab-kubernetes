{{- range $projectName, $project := .Values.projects }}
  {{- range $warehouseName, $warehouse := $project.warehouses }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: {{ $warehouseName }}
  namespace: {{ include "kargo.projectName" $projectName }}
spec:
    {{- with $warehouse.interval }}
  interval: {{ . }}
    {{- end }}
  subscriptions:
    {{- range $repoURL, $imageConfig := ($warehouse.subscriptions.image | default dict) }}
  - image:
      repoURL: {{ $repoURL }}
      {{- with $imageConfig }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- range $chartName, $chartConfig := ($warehouse.subscriptions.chart | default dict) }}
  - chart:
      repoURL: {{ $chartConfig.repoURL | required "repoURL is required for chart subscription" }}
      name: {{ $chartName }}
      {{- with (omit $chartConfig "repoURL") }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
