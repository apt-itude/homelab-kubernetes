projects:
  cert-manager:
    warehouses:
      main:
        subscriptions:
          chart:
            cert-manager:
              repoURL: https://charts.jetstack.io
              semverConstraint: ^1.0.0
              discoveryLimit: 5
    promotion:
      helmChartVersion: {}

  cloudflare-tunnel:
    warehouses:
      images:
        subscriptions:
          image:
            docker.io/cloudflare/cloudflared:
              discoveryLimit: 5
              # No pre-releases
              allowTagsRegexes:
                - ^\d{4}.\d{1,2}.\d+$
    promotion:
      helmAppVersion: {}

  coredns-k8s-gateway:
    warehouses:
      main:
        subscriptions:
          chart:
            k8s-gateway:
              repoURL: https://ori-edge.github.io/k8s_gateway/
              semverConstraint: ^2.0.0
              discoveryLimit: 5
    promotion:
      helmChartVersion: {}

  esphome:
    warehouses:
      images:
        subscriptions:
          image:
            ghcr.io/esphome/esphome:
              discoveryLimit: 5
              # No pre-releases
              allowTagsRegexes:
                - ^\d{4}.\d{1,2}.\d+$
    promotion:
      helmAppVersion: {}

  external-secrets:
    warehouses:
      main:
        subscriptions:
          chart:
            external-secrets:
              repoURL: https://charts.external-secrets.io
              semverConstraint: ^2.0.0
              discoveryLimit: 5
    promotion:
      helmChartVersion: {}

  home-assistant:
    warehouses:
      images:
        subscriptions:
          image:
            ghcr.io/home-assistant/home-assistant:
              discoveryLimit: 5
              # No pre-releases
              allowTagsRegexes:
                - ^\d{4}.\d{1,2}.\d+$
    promotion:
      helmAppVersion: {}

  longhorn-system:
    warehouses:
      main:
        subscriptions:
          chart:
            longhorn:
              repoURL: https://charts.longhorn.io
              semverConstraint: ^1.0.0
              discoveryLimit: 5
    promotion:
      helmChartVersion: {}

  metallb:
    warehouses:
      main:
        subscriptions:
          chart:
            metallb:
              repoURL: https://metallb.github.io/metallb
              semverConstraint: ^0.0.0
              discoveryLimit: 5
    promotion:
      helmChartVersion: {}

  mosquitto:
    warehouses:
      images:
        interval: 6h
        subscriptions:
          image:
            docker.io/eclipse-mosquitto:
              discoveryLimit: 5
    promotion:

  prometheus:
    warehouses:
      main:
        subscriptions:
          chart:
            kube-prometheus-stack:
              repoURL: https://prometheus-community.github.io/helm-charts
              discoveryLimit: 5
    promotion:
      helmChartVersion: {}

  unifi:
    warehouses:
      images:
        interval: 6h
        subscriptions:
          image:
            docker.io/jacobalberty/unifi:
              discoveryLimit: 5
              semverConstraint: ^9
            docker.io/bitnami/mongodb:
              discoveryLimit: 5
              semverConstraint: ^5
    promotion:
      helmImageTags:
        docker.io/jacobalberty/unifi:
          key: unifi.image.tag
        docker.io/bitnami/mongodb:
          key: unifi.mongodb.image.tag

  zwave-js-ui:
    warehouses:
      images:
        interval: 6h
        subscriptions:
          image:
            docker.io/zwavejs/zwave-js-ui:
              discoveryLimit: 5

    promotion:
      helmAppVersion: {}
