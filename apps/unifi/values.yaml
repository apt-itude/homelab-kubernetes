unifi:
  image:
    tag: v9.4.19

  env:
    # Disables the JVM's AVX-512 Base64 decoder intrinsic, which is exploitable on affected JDKs
    # (CVE-2026-114938, "Java4Shell"). -XX:UseAVX=2 would also work but the JVM rejects it on
    # arm64, and this pod can schedule onto arm64 nodes.
    JVM_EXTRA_OPTS: "-XX:-UseBASE64Intrinsics"

  service:
    main:
      type: LoadBalancer
      annotations:
        metallb.io/loadBalancerIPs: 192.168.1.211

  ingress:
    main:
      enabled: true
      annotations:
        ingress.kubernetes.io/protocol: https
        cert-manager.io/cluster-issuer: lucys-crib-acme
      hosts:
        - host: unifi.lucyscrib.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - unifi.lucyscrib.com
          secretName: unifi-lucys-crib-cert-acme

  resources:
    requests:
      cpu: 100m
      memory: 750Mi
    limits:
      cpu: 300m
      memory: 750Mi

  persistence:
    data:
      enabled: true
      accessMode: ReadWriteOnce
      size: 1Gi

  mongodb:
    enabled: true

    image:
      tag: 5.0.24

    useStatefulSet: true

    nodeAffinityPreset:
      type: hard
      key: kubernetes.io/arch
      values:
        - amd64

    resources:
      requests:
        cpu: 150m
        memory: 200Mi
      limits:
        cpu: 300m
        memory: 300Mi

    persistence:
      enabled: true
      size: 2Gi
